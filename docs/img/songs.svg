<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 292" width="860" height="292" role="img" aria-labelledby="t d"><title id="t">Music marking per model and setting</title><desc id="d">Prompt plus carry makes base, small and medium mark all 5 songs; large-v3-turbo marks none.</desc><style>
  .bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e3e2dc}.track{fill:#eceae4}
  .hi{fill:#2a78d6}.lo{fill:#8d8c86}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19}.t1{fill:#ffffff}.t2{fill:#c3c2b7}.grid{stroke:#3a3a37}.track{fill:#2b2b29}
    .hi{fill:#3987e5}.lo{fill:#8d8c86}}
  text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
</style><rect class="bg" width="860" height="292" rx="8"/><text class="t1" x="20" y="28" font-size="16" font-weight="600">Does the model mark music? 5 songs, 30 s of dialogue either side</text><text class="t2" x="20" y="48" font-size="12.5">Songs with at least one music tag (♪, [MUSIC]) inside the song, out of 5. Prompt: “♪ [MUSIC] ♪ (upbeat music) [SINGING]”.</text><text class="t2" x="190" y="78" font-size="12" font-weight="600">Default</text><text class="t2" x="410" y="78" font-size="12" font-weight="600">With --prompt</text><text class="t2" x="630" y="78" font-size="12" font-weight="600">--prompt + --carry-initial-prompt</text><text class="t1" x="20" y="105" font-size="12.5">tiny.en</text><rect class="track" x="190" y="93" width="150" height="16" rx="3"/><rect class="hi" x="190" y="93" width="30.0" height="16" rx="3"/><text class="t1" x="348" y="106" font-size="12">1/5</text><rect class="track" x="410" y="93" width="150" height="16" rx="3"/><text class="t1" x="568" y="106" font-size="12">0/5</text><rect class="track" x="630" y="93" width="150" height="16" rx="3"/><rect class="hi" x="630" y="93" width="90.0" height="16" rx="3"/><text class="t1" x="788" y="106" font-size="12">3/5</text><text class="t1" x="20" y="135" font-size="12.5">base.en</text><rect class="track" x="190" y="123" width="150" height="16" rx="3"/><rect class="hi" x="190" y="123" width="30.0" height="16" rx="3"/><text class="t1" x="348" y="136" font-size="12">1/5</text><rect class="track" x="410" y="123" width="150" height="16" rx="3"/><rect class="hi" x="410" y="123" width="150.0" height="16" rx="3"/><text class="t1" x="568" y="136" font-size="12">5/5</text><rect class="track" x="630" y="123" width="150" height="16" rx="3"/><rect class="hi" x="630" y="123" width="150.0" height="16" rx="3"/><text class="t1" x="788" y="136" font-size="12">5/5</text><text class="t1" x="20" y="165" font-size="12.5">small.en</text><rect class="track" x="190" y="153" width="150" height="16" rx="3"/><rect class="hi" x="190" y="153" width="120.0" height="16" rx="3"/><text class="t1" x="348" y="166" font-size="12">4/5</text><rect class="track" x="410" y="153" width="150" height="16" rx="3"/><rect class="hi" x="410" y="153" width="120.0" height="16" rx="3"/><text class="t1" x="568" y="166" font-size="12">4/5</text><rect class="track" x="630" y="153" width="150" height="16" rx="3"/><rect class="hi" x="630" y="153" width="150.0" height="16" rx="3"/><text class="t1" x="788" y="166" font-size="12">5/5</text><text class="t1" x="20" y="195" font-size="12.5">medium.en</text><rect class="track" x="190" y="183" width="150" height="16" rx="3"/><rect class="hi" x="190" y="183" width="90.0" height="16" rx="3"/><text class="t1" x="348" y="196" font-size="12">3/5</text><rect class="track" x="410" y="183" width="150" height="16" rx="3"/><rect class="hi" x="410" y="183" width="150.0" height="16" rx="3"/><text class="t1" x="568" y="196" font-size="12">5/5</text><rect class="track" x="630" y="183" width="150" height="16" rx="3"/><rect class="hi" x="630" y="183" width="150.0" height="16" rx="3"/><text class="t1" x="788" y="196" font-size="12">5/5</text><text class="t1" x="20" y="225" font-size="12.5">large-v3-turbo</text><rect class="track" x="190" y="213" width="150" height="16" rx="3"/><text class="t1" x="348" y="226" font-size="12">0/5</text><rect class="track" x="410" y="213" width="150" height="16" rx="3"/><text class="t1" x="568" y="226" font-size="12">0/5</text><rect class="track" x="630" y="213" width="150" height="16" rx="3"/><text class="t1" x="788" y="226" font-size="12">0/5</text><text class="t2" x="20" y="284" font-size="11.5">Bars start at 0. Prompting also adds false marks in the surrounding dialogue. Source: music test, docs/modeller_og_sweeps.md</text></svg>