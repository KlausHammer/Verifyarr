<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 448" width="860" height="448" role="img" aria-labelledby="t d"><title id="t">Pass rate per error type</title><desc id="d">All error types pass 100 percent except constant offset 63 of 66 (a 0.3 second boundary case) and per-line jitter 8 of 11.</desc><style>
  .bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e3e2dc}.track{fill:#eceae4}
  .hi{fill:#2a78d6}.lo{fill:#8d8c86}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19}.t1{fill:#ffffff}.t2{fill:#c3c2b7}.grid{stroke:#3a3a37}.track{fill:#2b2b29}
    .hi{fill:#3987e5}.lo{fill:#8d8c86}}
  text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
</style><rect class="bg" width="860" height="448" rx="8"/><text class="t1" x="20" y="28" font-size="16" font-weight="600">Injected errors, production setup (tiny.en + VAD, sampled)</text><text class="t2" x="20" y="48" font-size="12.5">11 approved episodes × 23 scenarios. Passed / run, per error type.</text><text class="t2" x="20" y="82" font-size="12" font-weight="600">Fixed automatically</text><text class="t1" x="20" y="107" font-size="12.5">Constant offset</text><rect class="track" x="270" y="95" width="280" height="16" rx="3"/><rect class="hi" x="270" y="95" width="267.3" height="16" rx="3"/><text class="t1" x="558" y="108" font-size="12">63/66</text><text class="t2" x="602" y="108" font-size="11.5">3 misses: +0.3 s, just over the 0.25 s bar</text><text class="t1" x="20" y="133" font-size="12.5">Framerate, PAL, drift</text><rect class="track" x="270" y="121" width="280" height="16" rx="3"/><rect class="hi" x="270" y="121" width="280.0" height="16" rx="3"/><text class="t1" x="558" y="134" font-size="12">66/66</text><text class="t2" x="20" y="164" font-size="12" font-weight="600">Detected and flagged (never rewritten wrong)</text><text class="t1" x="20" y="189" font-size="12.5">Mistimed blocks</text><rect class="track" x="270" y="177" width="280" height="16" rx="3"/><rect class="hi" x="270" y="177" width="280.0" height="16" rx="3"/><text class="t1" x="558" y="190" font-size="12">44/44</text><text class="t1" x="20" y="215" font-size="12.5">Missing middle</text><rect class="track" x="270" y="203" width="280" height="16" rx="3"/><rect class="hi" x="270" y="203" width="280.0" height="16" rx="3"/><text class="t1" x="558" y="216" font-size="12">11/11</text><text class="t1" x="20" y="241" font-size="12.5">Wrong episode</text><rect class="track" x="270" y="229" width="280" height="16" rx="3"/><rect class="hi" x="270" y="229" width="280.0" height="16" rx="3"/><text class="t1" x="558" y="242" font-size="12">11/11</text><text class="t1" x="20" y="267" font-size="12.5">Swapped lines</text><rect class="track" x="270" y="255" width="280" height="16" rx="3"/><rect class="hi" x="270" y="255" width="280.0" height="16" rx="3"/><text class="t1" x="558" y="268" font-size="12">11/11</text><text class="t1" x="20" y="293" font-size="12.5">Drift + swapped lines</text><rect class="track" x="270" y="281" width="280" height="16" rx="3"/><rect class="hi" x="270" y="281" width="280.0" height="16" rx="3"/><text class="t1" x="558" y="294" font-size="12">11/11</text><text class="t2" x="20" y="324" font-size="12" font-weight="600">Must not make things worse</text><text class="t1" x="20" y="349" font-size="12.5">Healthy file (no false alarm)</text><rect class="track" x="270" y="337" width="280" height="16" rx="3"/><rect class="hi" x="270" y="337" width="280.0" height="16" rx="3"/><text class="t1" x="558" y="350" font-size="12">11/11</text><text class="t1" x="20" y="375" font-size="12.5">Dropped / duplicated cues</text><rect class="track" x="270" y="363" width="280" height="16" rx="3"/><rect class="hi" x="270" y="363" width="280.0" height="16" rx="3"/><text class="t1" x="558" y="376" font-size="12">11/11</text><text class="t1" x="20" y="401" font-size="12.5">Per-line jitter (nothing to fix)</text><rect class="track" x="270" y="389" width="280" height="16" rx="3"/><rect class="hi" x="270" y="389" width="203.6" height="16" rx="3"/><text class="t1" x="558" y="402" font-size="12">8/11</text><text class="t2" x="602" y="402" font-size="11.5">alass chases the noise (all models)</text><text class="t2" x="20" y="434" font-size="11.5">Pass = fixed to within 0.25 s median and 98 % of lines within 1 s, or (for blocks / holes) flagged. Bars start at 0.</text></svg>