services:
  verifyarr:
    image: ghcr.io/klaushammer/verifyarr:latest
    container_name: verifyarr
    restart: unless-stopped
    cpu_shares: 128  # low priority vs other containers
    environment:
      PUID: 1000  # `id -u` / `id -g` on the host
      PGID: 1000
      UMASK: "022"
      TZ: Europe/Copenhagen
      PORT: 7979  # same as the right side of ports:
      WHISPER_MODEL: tiny.en  # others download on first use; non-English audio needs a multilingual model
    ports:
      - "7979:7979"
    volumes:
      # Same paths as Sonarr/Radarr see
      - /path/to/media/movies:/media/movies
      - /path/to/media/tv:/media/tv
      # Local disk only (SQLite breaks on NFS/SMB)
      - ./data:/data
      # - /path/to/whisper-models:/models:ro  # own whisper.cpp models
    # GPU for local Whisper (optional):
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "104"  # host's `getent group render`
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
